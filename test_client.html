<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>IPL Live Score — WS Test Client</title>
  <style>
    body { font-family: monospace; background: #111; color: #eee; padding: 20px; }
    #status { padding: 8px; margin-bottom: 12px; }
    .connected { background: #143d14; }
    .disconnected { background: #4d1414; }
    .ball { border-bottom: 1px solid #333; padding: 8px 0; }
    .wicket { color: #ff6b6b; }
    input, button { font-family: monospace; padding: 6px; }
  </style>
</head>
<body>
  <h2>IPL Live Score — WebSocket Test</h2>
  <p>Not a real frontend — this just proves Day 5's backend pushes live ball events to a browser.</p>

  <div>
    Match ID: <input id="matchId" placeholder="e.g. abc123" />
    <button onclick="connect()">Connect</button>
  </div>

  <div id="status" class="disconnected">Not connected</div>
  <div id="log"></div>

  <script>
    let ws = null;

    function connect() {
      const matchId = document.getElementById('matchId').value.trim();
      if (!matchId) {
        alert('Enter a match id first. Get one from GET /matches or check your terminal output.');
        return;
      }
      if (ws) ws.close();

      ws = new WebSocket(`ws://localhost:8000/ws/${matchId}`);

      ws.onopen = () => {
        document.getElementById('status').textContent = 'Connected — waiting for balls...';
        document.getElementById('status').className = 'connected';
      };

      ws.onclose = () => {
        document.getElementById('status').textContent = 'Disconnected';
        document.getElementById('status').className = 'disconnected';
      };

      ws.onmessage = (event) => {
        const ball = JSON.parse(event.data);
        const log = document.getElementById('log');
        const div = document.createElement('div');
        div.className = 'ball' + (ball.wickets_added > 0 ? ' wicket' : '');
        div.textContent = `[${ball.timestamp}] ${ball.summary}`;
        log.prepend(div);
      };
    }
  </script>
</body>
</html>
